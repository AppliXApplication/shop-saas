services:
  db:
    image: mysql:8.0
    container_name: shop-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shop_saas
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: shop_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: shop-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shop_saas
      DB_USER: shop_user
      DB_PASSWORD: shop_pass

volumes:
  db_data:
