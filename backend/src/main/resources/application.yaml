spring:
  application:
    name: shop

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shop_saas}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:shop_user}
    password: ${DB_PASSWORD:shop_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # схему меняем только через Flyway-миграции, Hibernate её не трогает
      naming:
        # Легаси-схема использует смешанные имена (id_categoryGoods, id_goods и т.п.).
        # Стандартная Spring-стратегия переписывает camelCase в snake_case даже для
        # явных @Column(name=...), из-за чего Hibernate ищет несуществующие колонки.
        # PhysicalNamingStrategyStandardImpl использует имена как есть, без конвертации.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}

app:
  security:
    jwt-secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_NOT_FOR_PRODUCTION_1234567890}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
